[pytest]
# Run from the backend folder:  .venv/bin/python -m pytest -v
# The API tests build a separate database, climate_test (see tests/conftest.py).
pythonpath = .
testpaths = tests
filterwarnings =
    # starlette's test client prints a deprecation notice about httpx; it doesn't affect the tests
    ignore:Using .httpx. with .starlette.testclient.
